providers:
  codex:
    label: Codex {model}
    command: ["codex", "exec", "--model", "{model}", "--yolo", "{prompt}"]
    review_command: ["codex", "exec", "--model", "{model}", "review", "{prompt}"]
  claude:
    label: Claude {model}
    command: ["claude", "--model", "{model}", "-p", "{prompt}", "--dangerously-skip-permissions", "--output-format", "text", "--no-session-persistence"]
  cursor:
    label: Cursor {model}
    command: ["remote-control-cursor", "run", "-p", "--model", "{model}", "--yolo", "--trust", "{prompt}"]
  kilo:
    label: Kilo {model}
    command: ["kilo", "--model", "{model}", "run", "{prompt}"]
  antigravity:
    label: Antigravity {model}
    command: ["agy", "--model", "{model}", "--print", "{prompt}", "--dangerously-skip-permissions"]

agents:
  - key: haiku
    label: Claude Haiku
    command: ["claude", "--model", "haiku", "-p", "{prompt}", "--dangerously-skip-permissions", "--output-format", "text", "--no-session-persistence"]
  - key: sonnet
    label: Claude Sonnet
    command: ["claude", "--model", "sonnet", "-p", "{prompt}", "--dangerously-skip-permissions", "--output-format", "text", "--no-session-persistence"]
  - key: opus
    label: Claude Opus
    command: ["claude", "--model", "opus", "-p", "{prompt}", "--dangerously-skip-permissions", "--output-format", "text", "--no-session-persistence"]
  - key: fable
    label: Claude Fable
    command: ["claude", "--model", "fable", "-p", "{prompt}", "--dangerously-skip-permissions", "--output-format", "text", "--no-session-persistence"]
  - key: claude
    label: Claude Sonnet
    command: ["claude", "--model", "sonnet", "-p", "{prompt}", "--dangerously-skip-permissions", "--output-format", "text", "--no-session-persistence"]
  - key: codex
    label: Codex
    command: ["codex", "exec", "--model", "gpt-6-sol", "-c", "model_reasoning_effort=\"medium\"", "--yolo", "{prompt}"]
    review_command: ["codex", "exec", "--model", "gpt-6-sol", "-c", "model_reasoning_effort=\"medium\"", "review", "{prompt}"]
  - key: antigravity
    label: Antigravity
    command: ["agy", "--print", "{prompt}", "--dangerously-skip-permissions"]
  - key: kilo
    label: kilo/kilo-auto/free
    command: ["kilo", "--model", "kilo/kilo-auto/free", "run", "{prompt}"]
  - key: kilo-opus-4.6
    label: Kilo Claude Opus 4.6
    command: ["kilo", "--model", "kilo/anthropic/claude-opus-4.6", "run", "{prompt}"]
  - key: kilo-opus-4.7
    label: Kilo Claude Opus 4.7
    command: ["kilo", "--model", "kilo/anthropic/claude-opus-4.7", "run", "{prompt}"]
  - key: kilo-sonnet-4.6
    label: Kilo Claude Sonnet 4.6
    command: ["kilo", "--model", "kilo/anthropic/claude-sonnet-4.6", "run", "{prompt}"]
  - key: cursor-auto
    label: Cursor Auto
    command: ["remote-control-cursor", "run", "-p", "--model", "auto", "--yolo", "--trust", "{prompt}"]
  - key: cursor-composer-2.5
    label: Cursor Composer 2.5
    command: ["remote-control-cursor", "run", "-p", "--model", "composer-2.5", "--yolo", "--trust", "{prompt}"]
  - key: cursor-grok-4.5
    label: Cursor Grok 4.5
    command: ["remote-control-cursor", "run", "-p", "--model", "cursor-grok-4.5-high", "--yolo", "--trust", "{prompt}"]
  - key: cursor-opus-4.6
    label: Cursor Opus 4.6
    command: ["remote-control-cursor", "run", "-p", "--model", "claude-4.6-opus-high", "--yolo", "--trust", "{prompt}"]
  - key: cursor-opus-4.7
    label: Cursor Opus 4.7
    command: ["remote-control-cursor", "run", "-p", "--model", "claude-opus-4-7-high", "--yolo", "--trust", "{prompt}"]
  - key: cursor-sonnet-4.6
    label: Cursor Sonnet 4.6
    command: ["remote-control-cursor", "run", "-p", "--model", "claude-4.6-sonnet-medium", "--yolo", "--trust", "{prompt}"]

aliases:
  grok: cursor:cursor-grok-4.6-high
