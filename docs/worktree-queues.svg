<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="680" viewBox="0 0 1140 680" role="img" aria-labelledby="title desc">
<title id="title">Worktree Queues</title><desc id="desc">You discuss work with a conversational agent that remains available. It routes ready tickets into two independent worktree queues. Each worktree has one serial orchestrator and its own durable ticket history. Commit tasks produce commits. Dashed lines return status to the conversational agent.</desc>
