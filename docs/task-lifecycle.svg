<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">One Ticket, Two Cycles</title>
  <desc id="desc">An optional Plan cycle precedes the required Commit cycle. Each horizontal row reads Make, Review, Finalize. Plan makes the approach; its Finalize position means a ready plan, not an additional executable planner step. Commit makes the work and finalizes a commit or other result. In each cycle, an approved review advances to Finalize and a rejected review returns to the same maker for revision. Review can be skipped in either cycle, and the whole Plan cycle can be skipped. Dashed outlines indicate optional cycles or reviews. Commit also supports non-commit work.</desc>
  <defs>
    <marker id="advance" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" fill="none" stroke="#00d25a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="return" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" fill="none" stroke="#a2b1bd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #a6b2bd; }
    .row-title { font-size: 32px; font-weight: 600; letter-spacing: -.7px; }
    .node-title { font-size: 28px; font-weight: 600; letter-spacing: -.5px; }
    .detail { font-size: 19px; fill: #b2bec7; }
    .route { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    .advance { stroke: #00d25a; }
    .return { stroke: #a2b1bd; }
    .bypass { stroke: #607268; }
    .route-label { font-size: 18px; }
    .node { fill: #202831; stroke: #3e4c57; stroke-width: 1.5; }
    .review { fill: #202831; stroke: #7b9286; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .finish { fill: #193225; stroke: #37734e; stroke-width: 1.5; }
  </style>

  <rect x=".5" y=".5" width="1119" height="759" rx="18" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="65" font-size="36" font-weight="600" letter-spacing="-.9">One Ticket, Two Cycles</text>
  <text x="40" y="100" font-size="21" class="muted">Plan when useful. Then do the work.</text>
  <g transform="translate(904 45)">
    <g stroke="#00d25a" stroke-width="3" stroke-linecap="round" opacity=".65">
      <path d="M0 3h16M0 13h7M0 23h12"/>
    </g>
    <g fill="#00d25a">
      <rect x="22" y="0" width="6" height="6" rx="1"/>
      <rect x="13" y="10" width="6" height="6" rx="1"/>
      <rect x="18" y="20" width="6" height="6" rx="1"/>
    </g>
    <text x="40" y="20" class="mono muted" font-size="18">Orchestra</text>
  </g>

  <!-- Row outlines communicate whether the entire cycle is optional. -->
  <g id="plan-cycle" aria-label="Plan: optional cycle">
    <rect x="32" y="140" width="1056" height="250" rx="14" fill="#131a21" stroke="#667c70" stroke-width="1.5" stroke-dasharray="6 7"/>
    <text x="60" y="228" class="row-title">Plan</text>
    <circle cx="66" cy="255" r="5" fill="none" stroke="#8fb59c" stroke-width="1.6"/>
    <text x="80" y="262" font-size="19" style="fill:#b7cdbf">Optional</text>
    <text x="60" y="300" class="detail">Skip to Commit*</text>

    <!-- Rejection returns to this cycle's maker. -->
    <path d="M660 226V198Q660 188 650 188H370Q360 188 360 198V226" class="route return" marker-end="url(#return)"/>
    <rect x="424" y="174" width="172" height="28" rx="5" fill="#131a21"/>
    <text x="510" y="194" text-anchor="middle" class="route-label muted">Rejected · revise</text>

    <path d="M460 274H552" class="route advance" marker-end="url(#advance)"/>
    <path d="M760 274H852" class="route advance" marker-end="url(#advance)"/>
    <text x="810" y="257" text-anchor="middle" class="route-label" style="fill:#91d6aa">Approved</text>

    <!-- A direct route from Make to Finalize allows review to be skipped. -->
    <path d="M360 322V350Q360 360 370 360H950Q960 360 960 350V322" class="route bypass" marker-end="url(#return)"/>
    <rect x="597" y="346" width="126" height="28" rx="5" fill="#131a21"/>
    <text x="660" y="366" text-anchor="middle" class="route-label muted">Skip review</text>

    <rect x="260" y="226" width="200" height="96" rx="10" class="node"/>
    <text x="280" y="266" class="node-title">Make</text>
    <text x="280" y="297" class="detail">Draft the approach</text>
    <rect x="560" y="226" width="200" height="96" rx="10" class="review"/>
    <text x="580" y="266" class="node-title">Review</text>
    <text x="580" y="297" class="detail">Check the plan</text>
    <!-- This is the accepted-plan outcome, not another planner execution. -->
    <rect x="860" y="226" width="200" height="96" rx="10" class="finish"/>
    <text x="880" y="266" class="node-title">Finalize</text>
    <text x="880" y="297" font-size="19" style="fill:#a9dfbc">Plan ready</text>
  </g>

  <path d="M560 400V425" class="route advance" marker-end="url(#advance)"/>

  <g id="commit-cycle" aria-label="Commit: required cycle, with optional review">
    <rect x="32" y="436" width="1056" height="250" rx="14" fill="#131a21" stroke="#3a5b46" stroke-width="1.5"/>
    <text x="60" y="524" class="row-title">Commit*</text>
    <circle cx="66" cy="551" r="5" fill="#00d25a"/>
    <text x="80" y="558" font-size="19" style="fill:#a9dfbc">Required</text>
    <text x="60" y="596" class="detail">Complete the work</text>

    <path d="M660 522V494Q660 484 650 484H370Q360 484 360 494V522" class="route return" marker-end="url(#return)"/>
    <rect x="424" y="470" width="172" height="28" rx="5" fill="#131a21"/>
    <text x="510" y="490" text-anchor="middle" class="route-label muted">Rejected · revise</text>

    <path d="M460 570H552" class="route advance" marker-end="url(#advance)"/>
    <path d="M760 570H852" class="route advance" marker-end="url(#advance)"/>
    <text x="810" y="553" text-anchor="middle" class="route-label" style="fill:#91d6aa">Approved</text>
    <path d="M360 618V646Q360 656 370 656H950Q960 656 960 646V618" class="route bypass" marker-end="url(#return)"/>
    <rect x="597" y="642" width="126" height="28" rx="5" fill="#131a21"/>
    <text x="660" y="662" text-anchor="middle" class="route-label muted">Skip review</text>

    <rect x="260" y="522" width="200" height="96" rx="10" class="node"/>
    <text x="280" y="562" class="node-title">Make</text>
    <text x="280" y="593" class="detail">Build and validate</text>
    <rect x="560" y="522" width="200" height="96" rx="10" class="review"/>
    <text x="580" y="562" class="node-title">Review</text>
    <text x="580" y="593" class="detail">Check the work</text>
    <rect x="860" y="522" width="200" height="96" rx="10" class="finish"/>
    <text x="880" y="562" class="node-title">Finalize</text>
    <text x="880" y="593" font-size="19" style="fill:#a9dfbc">Commit / result</text>
  </g>

  <text x="40" y="730" font-size="19" class="muted">* Also supports non-commit work.</text>
  <rect x="972" y="715" width="24" height="18" rx="4" fill="#131a21" stroke="#7b9286" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="1080" y="730" text-anchor="end" font-size="18" class="muted">Optional</text>
</svg>
