<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">One Ticket, One Commit</title>
  <desc id="desc">A ready ticket follows the required path through Implement and Finalize, which creates one commit. Planning and plan review are optional: skip planning entirely, or plan and skip its review. A rejected plan returns to Plan. Commit review is also optional; a rejected change returns to the same coder at Implement. Approved reviews move forward. Dashed cards mark optional steps.</desc>
  <defs>
    <linearGradient id="required-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2e24"/>
      <stop offset="1" stop-color="#17231e"/>
    </linearGradient>
    <marker id="forward-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1.5 8.5 5 2 8.5" fill="none" stroke="#00d25a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="optional-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1.5 8.5 5 2 8.5" fill="none" stroke="#81b695" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1.5 8.5 5 2 8.5" fill="none" stroke="#9bacaa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #edf3ef; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #a8b7b1; }
    .forward, .optional, .return { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .forward { stroke: #00d25a; stroke-width: 2.8; }
    .optional { stroke: #81b695; stroke-width: 2.3; }
    .return { stroke: #9bacaa; stroke-width: 2.2; }
    .optional-card { fill: #1b232b; stroke: #708b7d; stroke-width: 1.6; stroke-dasharray: 6 6; }
    .required-card { fill: url(#required-fill); stroke: #00d25a; stroke-width: 1.7; }
    .card-title { font-size: 28px; font-weight: 600; letter-spacing: -.5px; }
    .state { font-size: 17px; font-weight: 500; }
    .route-label { font-size: 19px; fill: #b3c4bb; }
  </style>

  <rect x=".5" y=".5" width="1199" height="639" rx="22" fill="#161b22" stroke="#303d36"/>
  <rect x="48" y="30" width="42" height="3" rx="1.5" fill="#00d25a"/>
  <text x="48" y="80" font-size="40" font-weight="650" letter-spacing="-1.2">One Ticket, One Commit</text>
  <text x="48" y="114" font-size="21" class="muted">Two feedback loops. One finished change.</text>

  <g transform="translate(1010 54)" stroke="#00d25a" stroke-width="2.7" stroke-linecap="round">
    <path d="M0 2h16M0 10h8M0 18h12" opacity=".65"/>
    <g fill="#00d25a" stroke="none">
      <rect x="21" y="-.5" width="5" height="5" rx="1"/>
      <rect x="13" y="7.5" width="5" height="5" rx="1"/>
      <rect x="17" y="15.5" width="5" height="5" rx="1"/>
    </g>
  </g>
  <text x="1152" y="71" text-anchor="end" font-size="16" letter-spacing="1" class="mono muted">ORCHESTRA</text>
  <path d="M48 143H1152" stroke="#303d36"/>

  <!-- Forward motion stays on the lower spine when optional stages are skipped. -->
  <path d="M74 492H546" class="forward" marker-end="url(#forward-arrow)"/>
  <path d="M742 492H990" class="forward" marker-end="url(#forward-arrow)"/>
  <text x="315" y="477" text-anchor="middle" class="route-label">Skip Planning</text>
  <text x="876" y="477" text-anchor="middle" class="route-label">Skip Commit Review</text>

  <!-- The optional planning branch includes a direct route past plan review. -->
  <path d="M84 492V305Q84 291 98 291H104" class="optional" marker-end="url(#optional-arrow)"/>
  <circle cx="84" cy="492" r="3.5" fill="#00d25a"/>
  <path d="M270 291H304" class="optional" marker-end="url(#optional-arrow)"/>
  <path d="M500 291H599Q613 291 613 305V426" class="optional" marker-end="url(#optional-arrow)"/>
  <text x="553" y="276" text-anchor="middle" class="route-label">Approved</text>
  <path d="M190 347V375Q190 389 204 389H613" class="optional"/>
  <circle cx="613" cy="389" r="3" fill="#81b695"/>
  <text x="395" y="376" text-anchor="middle" class="route-label">Skip Plan Review</text>
  <path d="M405 235V204Q405 190 391 190H204Q190 190 190 204V229" class="return" marker-end="url(#return-arrow)"/>
  <text x="298" y="177" text-anchor="middle" class="route-label">Rejected: Revise Plan</text>

  <!-- Review approval advances to Finalize; rejection returns to the same coder. -->
  <path d="M698 432V305Q698 291 712 291H770" class="optional" marker-end="url(#optional-arrow)"/>
  <text x="736" y="276" text-anchor="middle" class="route-label">Review</text>
  <path d="M996 291H1120Q1134 291 1134 305V426" class="optional" marker-end="url(#optional-arrow)"/>
  <text x="1068" y="276" text-anchor="middle" class="route-label">Approved</text>
  <path d="M896 347V375Q896 389 882 389H736Q722 389 722 403V426" class="return" marker-end="url(#return-arrow)"/>
  <text x="807" y="376" text-anchor="middle" class="route-label">Rejected: Rework</text>
  <text x="818" y="415" text-anchor="middle" font-size="17" class="muted">Same coder</text>

  <!-- Optional stages retain the dashed outline used in the README legend. -->
  <rect x="110" y="235" width="160" height="112" rx="14" class="optional-card"/>
  <text x="130" y="266" class="state muted">Optional</text>
  <text x="130" y="314" class="card-title">Plan</text>

  <rect x="310" y="235" width="190" height="112" rx="14" class="optional-card"/>
  <text x="330" y="266" class="state muted">Optional</text>
  <text x="330" y="314" font-size="26" font-weight="600" letter-spacing="-.5">Plan Review</text>

  <rect x="776" y="235" width="220" height="112" rx="14" class="optional-card"/>
  <text x="796" y="266" class="state muted">Optional</text>
  <text x="796" y="314" font-size="25" font-weight="600" letter-spacing="-.5">Commit Review</text>

  <!-- The required stages anchor the spine. Only finalization creates a commit. -->
  <rect x="552" y="432" width="190" height="132" rx="14" class="required-card"/>
  <text x="572" y="461" class="state" style="fill:#8fdfa9">Required</text>
  <text x="572" y="500" class="card-title">Implement</text>
  <text x="572" y="538" font-size="18" class="muted">Build and validate</text>

  <rect x="996" y="432" width="164" height="132" rx="14" class="required-card"/>
  <text x="1016" y="461" class="state" style="fill:#8fdfa9">Required</text>
  <text x="1016" y="500" font-size="27" font-weight="600" letter-spacing="-.5">Finalize</text>
  <rect x="1013" y="516" width="130" height="30" rx="6" fill="#00d25a"/>
  <path d="M1021 531h6m8 0h6" stroke="#12331f" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="1031" cy="531" r="3.5" fill="none" stroke="#12331f" stroke-width="1.8"/>
  <text x="1048" y="538" font-size="19" font-weight="600" style="fill:#12331f">1 Commit</text>

  <path d="M49 474h21v37l-5-3-5 3-5-3-6 3Z" fill="#1b2e24" stroke="#00d25a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M55 483h9m-9 6h9m-9 6h6" stroke="#8fdfa9" stroke-width="1.6" stroke-linecap="round"/>
  <text x="48" y="544" font-size="19" font-weight="500" class="muted">Ready Ticket</text>

  <path d="M48 589H1152" stroke="#303d36"/>
  <rect x="48" y="606" width="19" height="15" rx="3" fill="#1b232b" stroke="#708b7d" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="79" y="620" font-size="18" class="muted">Dashed cards are optional</text>
  <text x="1152" y="620" text-anchor="end" font-size="18" class="muted">Finalization creates the commit.</text>
</svg>
